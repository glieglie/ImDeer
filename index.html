<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ImDeer</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    color:#55445d;
    background:#faf2ff;
}

.screen{
    position:absolute;
    inset:0;
    display:none;
}

.screen.active{
    display:block;
}


/* ================= MENU ================= */

#menu{
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#fff4fc,#eaf8ff);
}

#menu.active{
    display:flex;
}

.menuBox{
    width:min(600px,90vw);
    padding:45px 30px;
    text-align:center;
    background:#ffffffdd;
    border-radius:30px;
    box-shadow:0 20px 70px #80608025;
}

.menuBox h1{
    margin:0;
    font-size:clamp(60px,10vw,95px);
    color:#a078b3;
}

.menuBox p{
    opacity:.55;
}

.menuButton{
    width:min(300px,80%);
    margin:12px auto;
    padding:15px;
    border:0;
    border-radius:15px;
    background:#dabce7;
    color:#573f61;
    cursor:pointer;
    box-shadow:0 5px #b38bc0;
}

.menuButton:active{
    transform:translateY(4px);
    box-shadow:0 1px #b38bc0;
}

#continueButton{
    display:none;
}

#resetButton{
    margin-top:25px;
    border:0;
    background:none;
    opacity:.35;
    cursor:pointer;
}


/* ================= ROOM ================= */

#room.active{
    display:block;
}

.topBar{
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 20px;
    background:#ffffffbb;
    border-bottom:2px solid #ead8ef;
}

.notebookButton{
    border:0;
    border-radius:10px;
    padding:9px 13px;
    background:white;
    cursor:pointer;
}

.roomArea{
    position:absolute;
    inset:65px 0 0;

    background:
        radial-gradient(circle at 20% 25%,white 0 2px,transparent 3px),
        linear-gradient(
            #fff7ff 0%,
            #fff7ff 70%,
            #dac7dc 70%,
            #dac7dc 100%
        );

    transition:1s;
}

.roomArea.dark{
    background:
        radial-gradient(circle at 70% 30%,#cdb9d2 0 1px,transparent 2px),
        linear-gradient(
            #ddd0e1 0%,
            #ddd0e1 70%,
            #9f8ca3 70%,
            #9f8ca3 100%
        );
}

.object{
    position:absolute;
    border:0;
    border-radius:17px;
    background:#fffafd;
    color:#654d6c;
    box-shadow:0 8px 25px #46325020;
    cursor:pointer;
    transition:.2s;
}

.object:hover{
    transform:scale(1.05);
}

#clock{
    top:10%;
    left:12%;
    width:110px;
    height:110px;
    border-radius:50%;
}

#books{
    left:15%;
    bottom:14%;
    width:160px;
    height:80px;
}

#poster{
    right:17%;
    top:14%;
    width:180px;
    height:120px;
}

#drawer{
    right:18%;
    bottom:14%;
    width:140px;
    height:80px;
}

#symbols{
    left:44%;
    top:48%;
    width:180px;
    height:80px;
    font-size:22px;
}

#mirror{
    right:5%;
    top:43%;
    width:100px;
    height:170px;
    display:none;
}

#status{
    position:absolute;
    left:20px;
    bottom:20px;
    opacity:.55;
}


/* ================= PUZZLES ================= */

#puzzle{
    align-items:center;
    justify-content:center;
    background:#faf3ff;
}

#puzzle.active{
    display:flex;
}

.puzzleBox{
    width:min(720px,92vw);
    max-height:90vh;
    overflow:auto;
    padding:35px;
    background:white;
    border-radius:28px;
    box-shadow:0 20px 70px #50325025;
}

#puzzleNumber{
    opacity:.45;
    font-size:14px;
}

.cipher{
    margin:25px 0;
    padding:25px;
    background:#f3e7f8;
    border-radius:15px;
    text-align:center;
    font-family:monospace;
    font-size:clamp(20px,4vw,34px);
    letter-spacing:4px;
    word-break:break-word;
}

#answer{
    width:100%;
    padding:14px;
    border:2px solid #e5d5eb;
    border-radius:12px;
    outline:none;
}

#solveButton{
    width:100%;
    margin-top:12px;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#d5b1e4;
    cursor:pointer;
}

#message{
    min-height:25px;
}


/* ================= NOTEBOOK ================= */

#notebook{
    align-items:center;
    justify-content:center;
    background:#0004;
}

#notebook.active{
    display:flex;
}

.notebook{
    width:min(600px,90vw);
    max-height:80vh;
    overflow:auto;
    padding:30px;
    background:#fffdf0;
    border-radius:20px;
}

.closeButton{
    float:right;
    border:0;
    background:none;
    font-size:25px;
    cursor:pointer;
}

.note{
    padding:12px;
    margin:10px 0;
    background:#fff8d9;
    border-radius:10px;
}


/* ================= ENDING ================= */

#ending{
    align-items:center;
    justify-content:center;
    background:#f8edff;
}

#ending.active{
    display:flex;
}

#redText{
    position:absolute;
    inset:0;
    overflow:hidden;
    display:none;
    color:red;
    font-family:monospace;
    font-size:clamp(20px,3vw,38px);
    font-weight:900;
    line-height:1.7;
    text-shadow:0 0 8px red;
}

.textStream{
    position:absolute;
    width:250vw;
    height:250vh;
    left:-70vw;
    top:-70vh;
    animation:moveText 1s linear infinite;
}

@keyframes moveText{
    from{
        transform:translate(65vw,-65vh);
    }
    to{
        transform:translate(-65vw,65vh);
    }
}

#finalText{
    position:absolute;
    inset:0;
    display:none;
    align-items:flex-end;
    justify-content:flex-start;
    padding:25px;
    background:#000;
    color:red;
    font-family:monospace;
    font-size:28px;
    font-weight:bold;
}

#fakeCrash{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:#050505;
    color:#888;
    font-family:monospace;
}

</style>
</head>

<body>


<!-- ================= MENU ================= -->

<section id="menu" class="screen active">

<div class="menuBox">

<h1>ImDeer</h1>

<p>♡ a tiny little puzzle game ♡</p>

<button id="playButton" class="menuButton">
PLAY
</button>

<button id="continueButton" class="menuButton">
CONTINUE
</button>

<button id="resetButton">
reset save
</button>

</div>

</section>


<!-- ================= ROOM ================= -->

<section id="room" class="screen">

<div class="topBar">

<b>♡ Deer Room</b>

<button id="notebookButton" class="notebookButton">
📓 Notebook
</button>

</div>

<div id="roomArea" class="roomArea">

<button id="clock" class="object">
7:14
</button>

<button id="books" class="object">
📚 Books
</button>

<button id="poster" class="object">
🌸 POSTER
<br><br>
△ ○ □ ☆
</button>

<button id="drawer" class="object">
🗄️ Drawer
</button>

<button id="symbols" class="object">
△ ○ □ ☆
</button>

<button id="mirror" class="object">
🪞
</button>

<div id="status">
Everything looks normal.
</div>

</div>

</section>


<!-- ================= PUZZLE ================= -->

<section id="puzzle" class="screen">

<div class="puzzleBox">

<div id="puzzleNumber">
Puzzle 1 / 10
</div>

<h2 id="puzzleTitle"></h2>

<p id="instruction"></p>

<div id="cipher" class="cipher"></div>

<input
id="answer"
placeholder="type your answer..."
autocomplete="off"
>

<button id="solveButton">
SOLVE
</button>

<p id="hint"></p>

<div id="message"></div>

</div>

</section>


<!-- ================= NOTEBOOK ================= -->

<section id="notebook" class="screen">

<div class="notebook">

<button id="closeNotebook" class="closeButton">
×
</button>

<h2>📓 Notebook</h2>

<div id="notes"></div>

</div>

</section>


<!-- ================= ENDING ================= -->

<section id="ending" class="screen">

<button
id="endingContinue"
class="menuButton"
style="position:relative;width:220px"
>
CONTINUE
</button>

<div id="redText"></div>

<div id="finalText">
TAKE THE DEAD TO
</div>

<div id="fakeCrash">
ImDeer stopped responding.
</div>

</section>


<script>

/* =====================================================
   SAVE
===================================================== */

const SAVE_KEY = "IMDEER_FINAL_GAME";

let progress =
Number(localStorage.getItem(SAVE_KEY) || 1);

let notes =
JSON.parse(
localStorage.getItem(SAVE_KEY+"_notes") || "[]"
);

if(progress < 1 || progress > 11){
    progress = 1;
}

function save(){

    localStorage.setItem(
        SAVE_KEY,
        String(progress)
    );

    localStorage.setItem(
        SAVE_KEY+"_notes",
        JSON.stringify(notes)
    );
}


/* =====================================================
   SCREEN CONTROL
===================================================== */

function show(id){

    document
        .querySelectorAll(".screen")
        .forEach(screen =>
            screen.classList.remove("active")
        );

    document
        .getElementById(id)
        .classList.add("active");
}


/* =====================================================
   VERIFIED PUZZLES
===================================================== */

const puzzles = [

/* 1 */

{
    title:"A little cipher ♡",

    instruction:
    "The alphabet moved three places.",

    cipher:
    "KHOOR",

    hint:
    "Caesar cipher. Shift every letter backward by 3.",

    answer:
    "HELLO",

    note:
    "Caesar shifts letters."
},


/* 2 */

{
    title:"Numbers",

    instruction:
    "Numbers are letters.",

    cipher:
    "3 - 8 - 5 - 3 - 11",

    hint:
    "A1Z26: A=1, B=2, C=3...",

    answer:
    "CHECK",

    note:
    "A1Z26 converts numbers into letters."
},


/* 3 */

{
    title:"The backwards alphabet",

    instruction:
    "Everything has its opposite.",

    cipher:
    "XSVXP",

    hint:
    "Atbash: A becomes Z, B becomes Y...",

    answer:
    "CHECK",

    note:
    "Atbash reverses the alphabet."
},


/* 4 */

{
    title:"Dots and dashes",

    instruction:
    "The symbols speak.",

    cipher:
    ".... . .-.. .--.",

    hint:
    "Morse code.",

    answer:
    "HELP",

    note:
    "Morse uses dots and dashes."
},


/* 5 */

{
    title:"The hidden key",

    instruction:
    "The key is DEER.",

    cipher:
    "GHWIK",

    hint:
    "Vigenère cipher. Use DEER repeatedly.",

    answer:
    "DEATH",

    note:
    "Vigenère uses a repeating keyword."
},


/* 6 */

{
    title:"The broken message",

    instruction:
    "The message has been split apart.",

    cipher:
    "XCEHCXK",

    hint:
    "Take the letters in positions 2, 3, 5, 6, and 7.",

    answer:
    "CHECK",

    note:
    "Not every letter belongs to the message."
},


/* 7 */

{
    title:"Numbers again",

    instruction:
    "Each number represents a letter.",

    cipher:
    "1-20-20-1-3-11",

    hint:
    "A1Z26: A=1, B=2, C=3...",

    answer:
    "ATTACK",

    note:
    "Numbers can hide words."
},


/* 8 */

{
    title:"Three steps",

    instruction:
    "Decode the numbers, then reverse the result.",

    cipher:
    "11-3-5-8-3",

    hint:
    "A1Z26 first, then reverse the letters.",

    answer:
    "CHECK",

    note:
    "Some puzzles require multiple operations."
},


/* 9 */

{
    title:"The reflection",

    instruction:
    "The answer is hiding backwards.",

    cipher:
    "KC EHC",

    hint:
    "Reverse the entire message.",

    answer:
    "CHECK",

    note:
    "Something is wrong with the reflection."
},


/* 10 */

{
    title:"One last thing",

    instruction:
    "Numbers → letters → reverse.",

    cipher:
    "20-5-18-3-5-19",

    hint:
    "A1Z26 first, then reverse the result.",

    answer:
    "SECRET",

    note:
    "The final cipher combines everything."
}

];


/* =====================================================
   PUZZLE → OBJECT
===================================================== */

const objectForPuzzle = {

    1:"poster",
    2:"books",
    3:"drawer",
    4:"symbols",
    5:"clock",
    6:"poster",
    7:"books",
    8:"drawer",
    9:"mirror",
    10:"symbols"

};


/* =====================================================
   ROOM
===================================================== */

const roomArea =
document.getElementById("roomArea");

const status =
document.getElementById("status");

const clock =
document.getElementById("clock");

const mirror =
document.getElementById("mirror");


function updateRoom(){

    if(progress >= 4){

        roomArea.classList.add("dark");

    }else{

        roomArea.classList.remove("dark");

    }


    if(progress >= 9){

        mirror.style.display = "block";

    }else{

        mirror.style.display = "none";

    }


    if(progress >= 7){

        clock.textContent = "3:33";

    }else{

        clock.textContent = "7:14";

    }


    if(progress >= 9){

        clock.textContent = "00:00";

    }
}


/* =====================================================
   OBJECT CLICK SYSTEM
===================================================== */

function clickObject(id){

    /*
       Nothing can happen after Puzzle 10.
    */

    if(progress > 10){
        return;
    }


    /*
       Find the ONE correct object.
    */

    const correct =
        objectForPuzzle[progress];


    /*
       Wrong object = no puzzle.
    */

    if(id !== correct){

        const messages = {

            poster:
            "The poster hasn't changed.",

            books:
            "The books don't seem relevant yet.",

            drawer:
            "The drawer won't open.",

            symbols:
            "The symbols mean nothing... yet.",

            clock:
            "The clock isn't important yet.",

            mirror:
            "The reflection looks normal."

        };

        status.textContent =
            messages[id];

        return;
    }


    /*
       Correct object.
    */

    openPuzzle(progress);
}


/* =====================================================
   OBJECT BUTTONS
===================================================== */

document.getElementById("poster")
.onclick =
() => clickObject("poster");

document.getElementById("books")
.onclick =
() => clickObject("books");

document.getElementById("drawer")
.onclick =
() => clickObject("drawer");

document.getElementById("symbols")
.onclick =
() => clickObject("symbols");

document.getElementById("clock")
.onclick =
() => clickObject("clock");

document.getElementById("mirror")
.onclick =
() => clickObject("mirror");


/* =====================================================
   OPEN PUZZLE
===================================================== */

function openPuzzle(number){

    /*
       Absolute anti-skip protection.
    */

    if(number !== progress){
        return;
    }

    if(number < 1 || number > 10){
        return;
    }


    const puzzle =
        puzzles[number - 1];


    document.getElementById("puzzleNumber")
    .textContent =
        "Puzzle " + number + " / 10";


    document.getElementById("puzzleTitle")
    .textContent =
        puzzle.title;


    document.getElementById("instruction")
    .textContent =
        puzzle.instruction;


    document.getElementById("cipher")
    .textContent =
        puzzle.cipher;


    document.getElementById("hint")
    .textContent =
        "Hint: " + puzzle.hint;


    document.getElementById("answer")
    .value = "";


    document.getElementById("message")
    .textContent = "";


    show("puzzle");


    setTimeout(() => {

        document
        .getElementById("answer")
        .focus();

    },50);
}


/* =====================================================
   SOLVE
===================================================== */

function solve(){

    if(progress < 1 || progress > 10){
        return;
    }


    const puzzle =
        puzzles[progress - 1];


    const entered =
        document
        .getElementById("answer")
        .value
        .trim()
        .toUpperCase()
        .replace(/\s+/g,"");


    const correct =
        puzzle.answer
        .toUpperCase()
        .replace(/\s+/g,"");


    if(entered !== correct){

        document
        .getElementById("message")
        .textContent =
        "Wrong. Look closer.";

        return;
    }


    document
    .getElementById("message")
    .textContent =
    "Correct.";


    if(!notes.includes(puzzle.note)){

        notes.push(puzzle.note);

    }


    /*
       THIS IS THE ONLY PLACE
       progress increases.
    */

    progress++;

    save();


    setTimeout(() => {

        if(progress === 11){

            show("ending");

        }else{

            show("room");

            updateRoom();

            status.textContent =
                "Something feels slightly different.";

        }

    },700);
}


document
.getElementById("solveButton")
.onclick =
solve;


document
.getElementById("answer")
.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            solve();

        }

    }
);


/* =====================================================
   MENU
===================================================== */

const continueButton =
document.getElementById("continueButton");


function updateMenu(){

    if(progress > 1){

        continueButton.style.display =
            "block";

    }else{

        continueButton.style.display =
            "none";

    }
}


document
.getElementById("playButton")
.onclick =
() => {

    /*
       PLAY = start completely fresh.
    */

    progress = 1;

    notes = [];

    save();

    show("room");

    updateRoom();

    status.textContent =
        "Everything looks normal.";

};


continueButton.onclick =
() => {

    if(progress === 11){

        show("ending");

    }else{

        show("room");

        updateRoom();

    }

};


/* =====================================================
   RESET
===================================================== */

document
.getElementById("resetButton")
.onclick =
() => {

    localStorage.removeItem(SAVE_KEY);

    localStorage.removeItem(
        SAVE_KEY+"_notes"
    );

    progress = 1;

    notes = [];

    updateMenu();

    show("menu");

};


/* =====================================================
   NOTEBOOK
===================================================== */

function updateNotes(){

    const box =
        document.getElementById("notes");

    box.innerHTML = "";


    if(notes.length === 0){

        box.innerHTML =
            "<p>It's empty.</p>";

        return;
    }


    notes.forEach(note => {

        const div =
            document.createElement("div");

        div.className =
            "note";

        div.textContent =
            note;

        box.appendChild(div);

    });
}


document
.getElementById("notebookButton")
.onclick =
() => {

    updateNotes();

    show("notebook");

};


document
.getElementById("closeNotebook")
.onclick =
() => {

    show("room");

};


/* =====================================================
   ENDING
===================================================== */

document
.getElementById("endingContinue")
.onclick =
() => {

    document
    .getElementById("endingContinue")
    .style.display =
        "none";

    startEnding();

};


function createTextStream(){

    const stream =
        document.createElement("div");

    stream.className =
        "textStream";


    let text = "";


    for(let i=0;i<110;i++){

        text +=
            "TAKE THE DEAD TO ".repeat(18);

        text += "<br>";

    }


    stream.innerHTML =
        text;


    return stream;
}


function startEnding(){

    const red =
        document.getElementById("redText");


    red.innerHTML = "";

    red.style.display =
        "block";


    /*
       Several streams means the text
       keeps entering from the top-right
       while disappearing off the bottom-left.
    */

    for(let i=0;i<5;i++){

        const stream =
            createTextStream();

        stream.style.animationDelay =
            (-i * .2) + "s";

        red.appendChild(stream);

    }


    setTimeout(() => {

        red.style.display =
            "none";


        document
        .getElementById("finalText")
        .style.display =
            "flex";


        setTimeout(() => {

            document
            .getElementById("finalText")
            .style.display =
                "none";


            document
            .getElementById("fakeCrash")
            .style.display =
                "flex";


            setTimeout(() => {

                document
                .getElementById("fakeCrash")
                .style.display =
                    "none";


                show("menu");

                updateMenu();

            },1800);

        },1200);

    },9000);
}


/* =====================================================
   START
===================================================== */

updateMenu();

updateRoom();

</script>

</body>
</html>
